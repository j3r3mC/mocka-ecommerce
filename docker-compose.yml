services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: mocka-app

    working_dir: /var/www

    volumes:
      - ./apps/api:/var/www

    depends_on:
      - postgres
      - redis

    tty: true

  postgres:
    image: postgres:17
    container_name: mocka-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mocka
      POSTGRES_USER: mocka
      POSTGRES_PASSWORD: mocka

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: mocka-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data:
