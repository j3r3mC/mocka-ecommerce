services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: mocka-app

    working_dir: /var/www

    volumes:
      - ./apps/api:/var/www
      - mocka_media:/var/www/storage/app/media

    depends_on:
      - postgres
      - redis

    tty: true

  postgres:
    image: postgres:17
    container_name: mocka-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mocka
      POSTGRES_USER: mocka
      POSTGRES_PASSWORD: mocka

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: mocka-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  media:
    image: nginx:1.29-alpine
    container_name: mocka-media
    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - mocka_media:/usr/share/nginx/html:ro
      - ./docker/media/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  mocka_media:
