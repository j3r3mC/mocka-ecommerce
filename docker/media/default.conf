server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        try_files $uri =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}